<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spencer Sanford — Personal Website</title>
  <style>
    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #111111;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation */
    header {
      background-color: #1a1a1a;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 56px;
    }

    nav button {
      background: none;
      border: none;
      display: inline-block;
      padding: 8px 16px;
      color: #cccccc;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      transition: background-color 0.15s, color 0.15s;
    }

    nav button:hover, nav button:focus {
      background-color: #333333;
      color: #ffffff;
    }

    nav button.active {
      background-color: #333333;
      color: #ffffff;
      font-weight: bold;
    }

    /* Page View Visibility */
    .page-view {
      width: 100%;
      flex: 1;
    }

    /* Homepage Styles */
    .hero-banner {
      background-color: #f2f2f2;
      padding: 40px 24px;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
    }

    .hero-banner h1 {
      max-width: 900px;
      margin: 0 auto;
      font-size: 1.35rem;
      font-weight: normal;
      color: #111111;
      line-height: 1.4;
    }

    .home-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 24px 20px;
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .text-column {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .text-block {
      margin-bottom: 60px;
    }

    .text-block:last-child {
      margin-bottom: 0;
    }

    .text-block h6 {
      font-size: 0.9rem;
      margin-top: 0;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #111111;
      font-weight: bold;
    }

    .text-block p {
      font-size: 0.95rem;
      color: #444444;
      line-height: 1.8;
    }

    .gallery-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .image-frame {
      width: 100%;
      border: 1px solid #cccccc;
      background-color: #fafafa;
      padding: 4px;
      box-sizing: border-box;
    }

    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
    }

    .video-section {
      max-width: 900px;
      margin: 20px auto 60px;
      padding: 40px 24px 0;
      border-top: 2px solid #dddddd
